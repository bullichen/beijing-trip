<!doctype html>
<html lang="zh-CN">
<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
name="theme-color"
content="#2563eb"
>

<title>
预约管家 - 北京十一旅行助手
</title>


<style>

:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#6b7280;
  --line:#e5e7eb;
  --blue:#2563eb;
  --green:#16a34a;
  --orange:#ea580c;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  "PingFang SC",
  "Microsoft YaHei",
  sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(245,247,251,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.head{
  max-width:760px;
  margin:auto;
  padding:11px 13px;
  display:flex;
  align-items:center;
  gap:10px;
}

.home{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  text-decoration:none;
  background:#fff;
  border-radius:12px;
  color:#172033;
  font-size:20px;
}

h1{
  font-size:19px;
  margin:0;
}

.sub{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:12px 12px 90px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:22px;
}

.stat span{
  font-size:11px;
  color:var(--muted);
}

.toolbar{
  display:flex;
  gap:8px;
  margin:10px 0;
}

.toolbar button{
  flex:1;
}

button{
  border:0;
  border-radius:11px;
  padding:10px 12px;
  font-weight:650;
  font-size:14px;
  background:#e8eefc;
  color:#174ea6;
}

button.primary{
  background:var(--blue);
  color:#fff;
}

.day{
  font-weight:800;
  margin:18px 4px 8px;
  font-size:16px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
  margin-bottom:9px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.name{
  font-size:16px;
  font-weight:800;
}

.date{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0;
}

.tag{
  font-size:11px;
  border-radius:999px;
  padding:4px 7px;
  background:#f0f3f8;
  color:#4b5563;
}

.tag.time{
  background:#eef2ff;
  color:#4338ca;
}

.note{
  font-size:12px;
  color:#596274;
  line-height:1.5;
  margin-bottom:9px;
}

.status{
  font-size:12px;
  font-weight:700;
  padding:5px 8px;
  border-radius:999px;
  white-space:nowrap;
  height:max-content;
}

.pending{
  background:#fff7ed;
  color:var(--orange);
}

.done{
  background:#ecfdf5;
  color:var(--green);
}

.none{
  background:#f3f4f6;
  color:#6b7280;
}

.actions{
  display:flex;
  gap:7px;
}

.actions button{
  flex:1;
  padding:8px;
  font-size:12px;
}

.countdown{
  font-size:12px;
  color:var(--blue);
  font-weight:700;
  margin-top:4px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:40px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:50;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.sheet{
  background:white;
  width:100%;
  max-width:760px;
  margin:auto;
  border-radius:20px 20px 0 0;
  padding:17px;
  max-height:92vh;
  overflow:auto;
}

.sheet h2{
  margin:0 0 14px;
  font-size:19px;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#4b5563;
  margin:10px 0 5px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #d7dce5;
  border-radius:10px;
  padding:10px;
  background:white;
}

textarea{
  min-height:70px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.full{
  grid-column:1/-1;
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.form-actions button{
  flex:1;
}

@media(min-width:700px){

  .modal{
    align-items:center;
  }

  .sheet{
    border-radius:20px;
    max-width:650px;
  }

}

</style>

</head>


<body>


<header>

<div class="head">

<a
class="home"
href="../"
>
⌂
</a>

<div>

<h1>
🗓️ 预约管家
</h1>

<div class="sub">
景点预约、倒计时和完成进度
</div>

</div>

</div>

</header>


<main class="wrap">


<div class="summary">

<div class="stat">

<b id="total">
0
</b>

<span>
全部行程
</span>

</div>


<div class="stat">

<b id="pending">
0
</b>

<span>
待预约
</span>

</div>


<div class="stat">

<b id="done">
0
</b>

<span>
已完成
</span>

</div>

</div>


<div class="toolbar">

<button
class="primary"
onclick="openAdd()"
>
＋ 添加行程
</button>

<button
onclick="exportData()"
>
导出备份
</button>

<button
onclick="document.getElementById('importFile').click()"
>
导入
</button>

<input
id="importFile"
type="file"
accept=".json"
style="display:none"
onchange="importData(event)"
>

</div>


<div id="list"></div>


</main>


<div
class="modal"
id="modal"
>

<div class="sheet">

<h2 id="modalTitle">
添加行程
</h2>


<div class="grid">


<div class="full">

<label>
活动 / 景点
</label>

<input
id="f_name"
placeholder="例如：故宫博物院"
>

</div>


<div>

<label>
出行日期
</label>

<input
id="f_visit"
type="date"
>

</div>


<div>

<label>
预约时间
</label>

<input
id="f_time"
type="time"
>

</div>


<div>

<label>
预约途径
</label>

<input
id="f_channel"
placeholder="例如：故宫"
>

</div>


<div>

<label>
提前期
</label>

<input
id="f_lead"
placeholder="例如：7天"
>

</div>


<div>

<label>
预约日期
</label>

<input
id="f_book"
type="date"
>

</div>


<div>

<label>
状态
</label>

<select id="f_status">

<option value="pending">
待预约
</option>

<option value="done">
已预约
</option>

<option value="none">
无需预约
</option>

</select>

</div>


<div class="full">

<label>
备注
</label>

<textarea id="f_note"></textarea>

</div>


</div>


<div class="form-actions">

<button onclick="closeModal()">
取消
</button>

<button
class="primary"
onclick="saveItem()"
>
保存
</button>

</div>


</div>

</div>


<script>

const KEY =
'beijing_october_trip_v1';


let items =
JSON.parse(
  localStorage.getItem(KEY) || 'null'
)
||
[

{
id:1,
visit:'2026-10-02',
name:'天安门升旗',
channel:'小程序',
lead:'7天',
time:'12:00',
book:'2026-09-25',
note:'西红墙口？',
status:'pending'
},

{
id:2,
visit:'2026-10-02',
name:'中山公园',
channel:'畅游公园',
lead:'7天',
time:'',
book:'2026-09-25',
note:'',
status:'pending'
},

{
id:3,
visit:'2026-10-02',
name:'故宫博物院',
channel:'故宫',
lead:'7天',
time:'20:00',
book:'2026-09-25',
note:'预约早上场次，20:00开始分批放票',
status:'pending'
},

{
id:4,
visit:'2026-10-02',
name:'景山公园',
channel:'畅游公园',
lead:'/',
time:'',
book:'',
note:'不需要提前预约',
status:'none'
},

{
id:5,
visit:'2026-10-02',
name:'恭王府',
channel:'恭王府',
lead:'10天',
time:'20:00',
book:'2026-09-22',
note:'',
status:'done'
},

{
id:6,
visit:'2026-10-03',
name:'国家博物馆',
channel:'国家博物馆',
lead:'7天',
time:'17:00',
book:'2026-09-26',
note:'预约早上场次',
status:'pending'
},

{
id:7,
visit:'2026-10-03',
name:'天坛公园',
channel:'畅游公园',
lead:'7天',
time:'21:00',
book:'2026-09-26',
note:'全价联票',
status:'pending'
},

{
id:8,
visit:'2026-10-04',
name:'颐和园',
channel:'畅游公园',
lead:'7天',
time:'21:00',
book:'2026-09-27',
note:'预约早上场次',
status:'pending'
},

{
id:9,
visit:'2026-10-04',
name:'清华大学',
channel:'参观清华',
lead:'8天',
time:'17:00',
book:'2026-09-26',
note:'',
status:'pending'
},

{
id:10,
visit:'2026-10-05',
name:'长城',
channel:'八达岭长城',
lead:'随时',
time:'',
book:'',
note:'',
status:'pending'
}

];


let editingId = null;


function escapeHTML(s){

return String(s ?? '')
.replace(
  /[&<>"']/g,
  c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

}


function save(){

localStorage.setItem(
  KEY,
  JSON.stringify(items)
);

render();

}


function formatDate(d){

if(!d){
  return '';
}

return new Date(
  d + 'T00:00:00'
)
.toLocaleDateString(
  'zh-CN',
  {
    month:'numeric',
    day:'numeric',
    weekday:'short'
  }
);

}


function countdown(
book,
time
){

const now =
new Date();


const target =
new Date(
  book
  +
  'T'
  +
  (time || '00:00')
  +
  ':00'
);


if(
  Number.isNaN(
    target.getTime()
  )
){

  return '';

}


const ms =
target - now;


if(ms > 0){

  const d =
  Math.floor(
    ms / 86400000
  );

  const h =
  Math.floor(
    ms / 3600000
  ) % 24;

  const m =
  Math.floor(
    ms / 60000
  ) % 60;


  return (
    '距离预约开放：'
    +
    (d ? d + '天 ' : '')
    +
    h
    +
    '小时'
    +
    m
    +
    '分钟'
  );

}


if(
  now.toDateString()
  ===
  target.toDateString()
){

  return '⚠️ 今天是预约开放日';

}


return '预约开放时间已到';

}


function render(){

items.sort(
  (a,b) =>
  (a.visit || '')
  .localeCompare(
    b.visit || ''
  )
);


const groups = {};


items.forEach(
  x => {

    if(
      !groups[x.visit]
    ){

      groups[x.visit] = [];

    }

    groups[x.visit]
    .push(x);

  }
);


document
.getElementById('total')
.textContent =
items.length;


document
.getElementById('pending')
.textContent =
items.filter(
  x => x.status === 'pending'
).length;


document
.getElementById('done')
.textContent =
items.filter(
  x => x.status === 'done'
).length;


let out = '';


Object
.keys(groups)
.forEach(
day => {

  out +=
  `<div class="day">
  ${formatDate(day)}
  </div>`;


  groups[day]
  .forEach(
  x => {

    const cls =
    x.status === 'done'
    ?
    'done'
    :
    x.status === 'none'
    ?
    'none'
    :
    'pending';


    const label =
    x.status === 'done'
    ?
    '✓ 已预约'
    :
    x.status === 'none'
    ?
    '无需预约'
    :
    '待预约';


    const cd =
    x.book
    ?
    countdown(
      x.book,
      x.time
    )
    :
    '';


    out +=
    `

    <div class="card">

      <div class="row">

        <div>

          <div class="name">
            ${escapeHTML(x.name)}
          </div>

          <div class="date">
            出行：${x.visit}
          </div>

        </div>

        <span class="status ${cls}">
          ${label}
        </span>

      </div>


      <div class="meta">

        ${
          x.channel
          ?
          `<span class="tag">
          📱 ${escapeHTML(x.channel)}
          </span>`
          :
          ''
        }

        ${
          x.lead
          ?
          `<span class="tag">
          提前 ${escapeHTML(x.lead)}
          </span>`
          :
          ''
        }

        ${
          x.time
          ?
          `<span class="tag time">
          ⏰ ${escapeHTML(x.time)}
          </span>`
          :
          ''
        }

        ${
          x.book
          ?
          `<span class="tag">
          📅 ${x.book}
          </span>`
          :
          ''
        }

      </div>


      ${
        cd
        ?
        `<div class="countdown">
        ${cd}
        </div>`
        :
        ''
      }


      ${
        x.note
        ?
        `<div class="note">
        ${escapeHTML(x.note)}
        </div>`
        :
        ''
      }


      <div class="actions">

        <button
        onclick="toggleStatus(${x.id})"
        >
          ${
            x.status === 'done'
            ?
            '改为待预约'
            :
            '标记已预约'
          }
        </button>

        <button
        onclick="openEdit(${x.id})"
        >
          编辑
        </button>

        <button
        onclick="removeItem(${x.id})"
        >
          删除
        </button>

      </div>

    </div>

    `;

  });

});


document
.getElementById('list')
.innerHTML =
out
||
'<div class="empty">暂时没有行程。</div>';

}


function value(id){

return document
.getElementById(id)
.value
.trim();

}


function openAdd(){

editingId = null;


document
.getElementById('modalTitle')
.textContent =
'添加行程';


[
'f_name',
'f_visit',
'f_time',
'f_channel',
'f_lead',
'f_book',
'f_note'
]
.forEach(
id => {

  document
  .getElementById(id)
  .value = '';

}
);


document
.getElementById('f_status')
.value =
'pending';


document
.getElementById('modal')
.classList
.add('show');

}


function openEdit(id){

const x =
items.find(
  item => item.id === id
);


if(!x){
  return;
}


editingId = id;


document
.getElementById('modalTitle')
.textContent =
'编辑行程';


document
.getElementById('f_name')
.value =
x.name;


document
.getElementById('f_visit')
.value =
x.visit;


document
.getElementById('f_time')
.value =
x.time || '';


document
.getElementById('f_channel')
.value =
x.channel || '';


document
.getElementById('f_lead')
.value =
x.lead || '';


document
.getElementById('f_book')
.value =
x.book || '';


document
.getElementById('f_status')
.value =
x.status;


document
.getElementById('f_note')
.value =
x.note || '';


document
.getElementById('modal')
.classList
.add('show');

}


function closeModal(){

document
.getElementById('modal')
.classList
.remove('show');

}


function saveItem(){

const data = {

  name:
  value('f_name'),

  visit:
  value('f_visit'),

  time:
  value('f_time'),

  channel:
  value('f_channel'),

  lead:
  value('f_lead'),

  book:
  value('f_book'),

  status:
  value('f_status'),

  note:
  value('f_note')

};


if(
  !data.name
  ||
  !data.visit
){

  alert(
    '请至少填写活动和出行日期。'
  );

  return;

}


if(editingId){

  Object.assign(
    items.find(
      item =>
      item.id === editingId
    ),
    data
  );

}else{

  data.id =
  Date.now();

  items.push(data);

}


closeModal();

save();

}


function toggleStatus(id){

const x =
items.find(
  item => item.id === id
);


if(!x){
  return;
}


x.status =
x.status === 'done'
?
'pending'
:
'done';


save();

}


function removeItem(id){

if(
  confirm(
    '确定删除这条行程吗？'
  )
){

  items =
  items.filter(
    x => x.id !== id
  );

  save();

}

}


function autoBook(){

const visit =
value('f_visit');


const lead =
value('f_lead');


const match =
lead.match(
  /(\d+)/
);


if(
  visit
  &&
  match
){

  const d =
  new Date(
    visit + 'T00:00:00'
  );


  d.setDate(
    d.getDate()
    -
    Number(match[1])
  );


  document
  .getElementById('f_book')
  .value =
  d.toISOString()
  .slice(0,10);

}

}


document
.getElementById('f_visit')
.addEventListener(
  'change',
  autoBook
);


document
.getElementById('f_lead')
.addEventListener(
  'change',
  autoBook
);


function exportData(){

const blob =
new Blob(
  [
    JSON.stringify(
      items,
      null,
      2
    )
  ],
  {
    type:'application/json'
  }
);


const a =
document.createElement('a');


a.href =
URL.createObjectURL(blob);


a.download =
'北京十一预约行程备份.json';


a.click();


URL.revokeObjectURL(
  a.href
);

}


function importData(e){

const file =
e.target.files[0];


if(!file){
  return;
}


const reader =
new FileReader();


reader.onload =
() => {

  try{

    const data =
    JSON.parse(
      reader.result
    );


    if(
      !Array.isArray(data)
    ){

      throw new Error();

    }


    items = data;

    save();

    alert(
      '导入成功'
    );

  }catch{

    alert(
      '文件格式不正确'
    );

  }

};


reader.readAsText(file);


e.target.value = '';

}


render();


setInterval(
  render,
  60000
);

</script>

</body>

</html>
